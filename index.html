    <script type="text/babel">
const { useState, useEffect, createContext, useContext } = React;
const { HashRouter, Switch, Route, Link, NavLink, Redirect, useHistory } = ReactRouterDOM;

// ----------------------
// AUTH CONTEXT
// ----------------------
const AuthContext = createContext();

const AuthProvider = ({ children }) => {
    // Current user state
    const [currentUser, setCurrentUser] = useState(() => {
        const savedUser = localStorage.getItem('porra_user');
        return savedUser ? JSON.parse(savedUser) : null;
    });

    // Users Database state
    const [users, setUsers] = useState(() => {
        const saved = localStorage.getItem('porra_users');
        if (saved) return JSON.parse(saved);
        return [
            { id: 0, name: 'Admin', email: 'admin@laporra.com', role: 'admin', status: 'approved' },
            { id: 1, name: 'Pablo', email: 'pablo@email.com', role: 'jugador', status: 'approved' }
        ];
    });

    // Predictions state
    const [predictions, setPredictions] = useState(() => {
        const saved = localStorage.getItem('porra_predictions');
        if (saved) return JSON.parse(saved);
        return []; 
    });

    // Bizums state
    const [bizums, setBizums] = useState(() => {
        const saved = localStorage.getItem('porra_bizums');
        if (saved) return JSON.parse(saved);
        return []; 
    });

    useEffect(() => {
        if (currentUser) localStorage.setItem('porra_user', JSON.stringify(currentUser));
        else localStorage.removeItem('porra_user');
    }, [currentUser]);

    useEffect(() => { localStorage.setItem('porra_users', JSON.stringify(users)); }, [users]);
    useEffect(() => { localStorage.setItem('porra_predictions', JSON.stringify(predictions)); }, [predictions]);
    useEffect(() => { localStorage.setItem('porra_bizums', JSON.stringify(bizums)); }, [bizums]);

    const login = (email) => {
        const user = users.find(u => u.email === email && u.status === 'approved');
        if (user) {
            setCurrentUser(user);
            return true;
        }
        return false;
    };

    const logout = () => setCurrentUser(null);

    const registerUser = (userData) => {
        const newUser = {
            id: Date.now(),
            ...userData,
            role: 'jugador',
            status: 'pending'
        };
        setUsers(prev => [...prev, newUser]);
        
        if (userData.hasPayment) {
            setBizums(prev => [...prev, {
                id: Date.now(),
                userId: newUser.id,
                name: newUser.name,
                phone: userData.phone,
                amount: '32€',
                status: 'pending'
            }]);
        }
        return true;
    };

    const approveUser = (id) => setUsers(prev => prev.map(u => u.id === id ? { ...u, status: 'approved' } : u));
    const rejectUser = (id) => setUsers(prev => prev.filter(u => u.id !== id));
    
    const approveBizum = (id) => setBizums(prev => prev.map(b => b.id === id ? { ...b, status: 'approved' } : b));
    const rejectBizum = (id) => setBizums(prev => prev.filter(b => b.id !== id));

    const submitPrediction = (predictionData) => {
        if (!currentUser) return;
        const newPrediction = {
            id: Date.now(),
            userId: currentUser.id,
            timestamp: new Date().toISOString(),
            ...predictionData
        };
        setPredictions(prev => {
            const filtered = prev.filter(p => !(p.userId === currentUser.id && p.matchId === predictionData.matchId));
            return [...filtered, newPrediction];
        });
    };

    return (
        <AuthContext.Provider value={{ 
            currentUser, users, predictions, bizums,
            login, logout, registerUser, approveUser, rejectUser, 
            approveBizum, rejectBizum, submitPrediction 
        }}>
            {children}
        </AuthContext.Provider>
    );
};

const useAuth = () => useContext(AuthContext);

const ProtectedRoute = ({ component: Component, ...rest }) => {
    const { currentUser } = useAuth();
    return (
        <Route {...rest} render={props => (
            currentUser ? <Component {...props} /> : <Redirect to="/login" />
        )} />
    );
};

const AdminRoute = ({ component: Component, ...rest }) => {
    const { currentUser } = useAuth();
    return (
        <Route {...rest} render={props => (
            currentUser && currentUser.role === 'admin' ? <Component {...props} /> : <Redirect to="/home" />
        )} />
    );
};

        const timer = setInterval(() => {

                if (prev.s > 0) return { ...prev, s: prev.s - 1 };
                if (prev.m > 0) return { h: prev.h, m: prev.m - 1, s: 59 };
                if (prev.h > 0) return { h: prev.h - 1, m: 59, s: 59 };
                return { h: 0, m: 0, s: 0 };

const PredictionSystem = () => {
    const { currentUser, submitPrediction, predictions } = useAuth();
    const [selectedMatch, setSelectedMatch] = React.useState(null);
    const [status, setStatus] = React.useState('idle');
    const [localGoals, setLocalGoals] = React.useState('');
    const [awayGoals, setAwayGoals] = React.useState('');
    const [filter, setFilter] = React.useState('all'); // all, open, closed, finished

    const availableMatches = [
        { id: 'ARG-JPN', home: 'Argentina', away: 'Japón', homeFlag: '🇦🇷', awayFlag: '🇯🇵', date: '26 Jun 2026', time: '21:00h', status: 'open' },
        { id: 'BRA-MAR', home: 'Brasil', away: 'Marruecos', homeFlag: '🇧🇷', awayFlag: '🇲🇦', date: '27 Jun 2026', time: '18:00h', status: 'open' },
        { id: 'ESP-MEX', home: 'España', away: 'México', homeFlag: '🇪🇸', awayFlag: '🇲🇽', date: '28 Jun 2026', time: '21:00h', status: 'open' },
        { id: 'FRA-GER', home: 'Francia', away: 'Alemania', homeFlag: '🇫🇷', awayFlag: '🇩🇪', date: '29 Jun 2026', time: '18:00h', status: 'closed' },
        { id: 'ENG-POR', home: 'Inglaterra', away: 'Portugal', homeFlag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', awayFlag: '🇵🇹', date: '30 Jun 2026', time: '21:00h', status: 'closed' },
        { id: 'NED-URU', home: 'Países Bajos', away: 'Uruguay', homeFlag: '🇳🇱', awayFlag: '🇺🇾', date: '25 Jun 2026', time: '18:00h', status: 'finished', result: '1-2' },
    ];

    const userPredictions = currentUser ? predictions.filter(p => p.userId === currentUser.id) : [];
    const filteredMatches = availableMatches.filter(m => filter === 'all' || m.status === filter);

    const handleSelectMatch = (match) => {
        if (match.status !== 'open') return;
        setSelectedMatch(match);
        const existing = userPredictions.find(p => p.matchId === match.id);
        if (existing) {
            setLocalGoals(existing.localGoals.toString());
            setAwayGoals(existing.awayGoals.toString());
        } else {
            setLocalGoals('');
            setAwayGoals('');
        }
        setStatus('idle');
    };

    const handleSubmit = (e) => {
        e.preventDefault();
        
        if (!currentUser) {
            alert('Debes iniciar sesión para guardar un pronóstico.');
            return;
        }

        setStatus('submitting');
        setTimeout(() => {
            submitPrediction({
                matchId: selectedMatch.id,
                matchName: `${selectedMatch.home} vs ${selectedMatch.away}`,
                localGoals: parseInt(localGoals, 10),
                awayGoals: parseInt(awayGoals, 10)

            setStatus('success');

                </div>

                {!selectedMatch ? (

                                                </div>
                                            </div>
                                            
                                            {userPred && (

                                                    <p className="text-blue-400 text-[10px] font-bold uppercase tracking-widest mb-1">Tu Predicción</p>
                                                    <p className="font-mono font-bold text-white">{userPred.localGoals} - {userPred.awayGoals}</p>
                                                </div>
                                            )}

                                                disabled={match.status !== 'open'}

const LiveMatchSimulation = () => {
    const { currentUser, predictions } = useAuth();
    const history = useHistory();
    const [time, setTime] = React.useState(0);
    const [events, setEvents] = React.useState([]);
    const [score, setScore] = React.useState({ home: 0, away: 0 });
    const [matchEnded, setMatchEnded] = React.useState(false);

    // Get real prediction for Argentina vs Japón
    const argJpnPrediction = currentUser ? predictions.find(p => p.userId === currentUser.id && p.matchId === 'ARG-JPN') : null;
    const userPrediction = argJpnPrediction ? { home: argJpnPrediction.localGoals, away: argJpnPrediction.awayGoals } : { home: 2, away: 1 };
    
    // Predetermined events for the simulation
    const matchEvents = [
        { min: 12, type: 'goal', team: 'home', player: 'Messi', label: '⚽ Gol Argentina' },
        { min: 34, type: 'yellow', team: 'away', player: 'Morita', label: '🟨 Tarjeta Amarilla' },
        { min: 51, type: 'goal', team: 'away', player: 'Kubo', label: '⚽ Gol Japón' },
        { min: 67, type: 'goal', team: 'home', player: 'Julián Álvarez', label: '⚽ Gol Argentina' },
        { min: 88, type: 'yellow', team: 'home', player: 'De Paul', label: '🟨 Tarjeta Amarilla' }
    ];

    React.useEffect(() => {
        // Fast simulation: 1 real second = 5 virtual minutes
        if (time < 90) {
            const timer = setTimeout(() => {
                const nextTime = time + 1;
                setTime(nextTime);
                
                // Check for events
                const newEvents = matchEvents.filter(e => e.min === nextTime);
                if (newEvents.length > 0) {
                    setEvents(prev => [...prev, ...newEvents]);
                    newEvents.forEach(ev => {
                        if (ev.type === 'goal') {
                            setScore(prev => ({
                                ...prev,
                                [ev.team]: prev[ev.team] + 1
                            }));
                        }
                    });
                }
            }, 200); // Super fast for demo purposes
            return () => clearTimeout(timer);
        } else if (time === 90 && !matchEnded) {
            setTimeout(() => setMatchEnded(true), 1500);
        }
    }, [time, matchEnded]);

    // Determine current prediction status
    let predictionStatus = "Resultado Incorrecto";
    let pts = 0;
    let statusColor = "text-red-400 border-red-500/30 bg-red-500/10";
    
    if (score.home === userPrediction.home && score.away === userPrediction.away) {
        predictionStatus = "Coincide con resultado exacto";
        pts = 4;
        statusColor = "text-emerald-400 border-emerald-500/30 bg-emerald-500/10";
    } else if (
        (score.home > score.away && userPrediction.home > userPrediction.away) ||
        (score.home < score.away && userPrediction.home < userPrediction.away) ||
        (score.home === score.away && userPrediction.home === userPrediction.away)
    ) {
        predictionStatus = "Signo de partido correcto";
        pts = 2;
        statusColor = "text-amber-400 border-amber-500/30 bg-amber-500/10";
    }

                        Partido del Día

                    <p className="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto font-medium">Sigue el partido minuto a minuto y descubre si tu pronóstico te acerca al podio.</p>

const LoginPage = () => {
    const { login, currentUser } = useAuth();
    const [email, setEmail] = useState('');
    const [error, setError] = useState(false);

    if (currentUser) {
        return <Redirect to="/perfil" />;
    }

    const handleSubmit = (e) => {
        e.preventDefault();
        if(login(email, 'mock_pass')) {
            // success
        } else {
            setError(true);
        }
    };

    return (
        <section className="pt-40 pb-24 relative min-h-[80vh] flex items-center justify-center">
            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-emerald-900/10 via-transparent to-transparent pointer-events-none"></div>
            <div className="container mx-auto px-4 max-w-md relative z-10">
                <div className="text-center mb-8 animate-fade-in-up">
                    <Icons.Lock className="w-12 h-12 text-emerald-400 mx-auto mb-4" />
                    <h2 className="text-3xl font-black text-white font-display uppercase tracking-widest">Área Privada</h2>
                </div>
                <div className="glass-card p-10 rounded-[2rem] border-emerald-500/20 shadow-[0_0_30px_rgba(16,185,129,0.1)]">
                    {error && <div className="bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl mb-6 text-sm text-center">Usuario no válido. Prueba admin@laporra.com o algo distinto para jugador.</div>}
                    <form onSubmit={handleSubmit} className="space-y-6">
                        <div>
                            <label className="block text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Usuario o Email</label>
                            <input 
                                type="text" 
                                required 
                                value={email} 
                                onChange={e => setEmail(e.target.value)} 
                                className="w-full bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-white focus:outline-none focus:border-emerald-500/50 transition-all" 
                                placeholder="tu@email.com" 
                            />
                        </div>
                        <button type="submit" className="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-[#050505] font-black text-sm uppercase tracking-widest rounded-xl transition-colors">
                            Iniciar Sesión
                        </button>
                    </form>
                    <div className="mt-6 text-center border-t border-white/5 pt-6">
                        <p className="text-slate-400 text-xs font-medium">¿No tienes cuenta? <Link to="/registro" className="text-emerald-400 font-bold hover:underline ml-1">Regístrate ahora</Link></p>
                    </div>
                </div>
            </div>
        </section>
    );
};

// --- MAIN APP COMPONENT ---
const App = () => {
  return (
    <AuthProvider>
        <HashRouter>
            <div className="flex flex-col min-h-screen">
                <Navbar />
                
                <main className="flex-grow w-full relative z-10 pt-16">
                    <Switch>
                        {/* Public Routes */}
                        <Route exact path="/" component={HomePage} />
                        <Route exact path="/home" component={HomePage} />
                        <Route exact path="/premios" component={PremiosPage} />
                        <Route exact path="/reglamento" component={ReglamentoPage} />
                        <Route exact path="/login" component={LoginPage} />
                        <Route exact path="/registro" component={RegistroPage} />

                        {/* Protected Routes */}
                        <ProtectedRoute exact path="/perfil" component={PerfilPage} />
                        <ProtectedRoute exact path="/predicciones" component={DashboardJugadorPage} />
                        <ProtectedRoute exact path="/clasificacion" component={ClasificacionPage} />

                        {/* Admin Route */}
                        <AdminRoute exact path="/admin" component={AdminPage} />

                        {/* Fallback */}
                        <Redirect to="/" />
                    </Switch>
                </main>

                <Footer />
            </div>
        </HashRouter>
    </AuthProvider>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
